filter {
    if "FEDERATION_REST" in [tags] {

        mutate {
            add_field => { "logtrail" => "hdp-federation-rest" }
            add_tag => [ "CP23_MUT01" ]
        }

        grok {
            break_on_match => true
             # Federated calls
             match => { "message" => "^\[%{TIMESTAMP_ISO8601:timestamp}\]\[%{DATA:level}\]\[%{DATA:ehr.node_name}\]\[%{DATA:break_the_glass}\] - %{GREEDYDATA:log_message}" }

             match => { "message" => "^%{TIMESTAMP_ISO8601:timestamp}\s%{DATA:level}\s%{GREEDYDATA:log_message}" }
             match => { "message" => "\[.*?\]%{GREEDYDATA:log_message}" }
            add_tag => [ "CP23_GRO01" ]
        }

        date {
            timezone => "Europe/Amsterdam"
            match => [ "timestamp" ,
                       "ISO8601",
                       "yyyy/MM/dd HH:mm:ss.SSSZ",
                       "yyyy-MM-dd HH:mm:ss.SSSZ"
                     ]
            remove_field => [ "timestamp" ]       # cleanup, data is available in @timestamp
            add_tag => [ "CP23_DAT01" ]
        }
    }
}
