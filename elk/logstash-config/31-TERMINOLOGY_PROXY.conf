filter {
    if "TERMINOLOGY_PROXY" in [tags] {

        mutate {
            add_field => { "logtrail" => "hdp-terminology-proxy" }
            add_tag => [ "CP31_MUT01" ]
        }

        grok {
            break_on_match => true
            match => { "message" => "^\[%{TIMESTAMP_ISO8601:timestamp}\]\[%{DATA:level}\] - %{GREEDYDATA:log_message}" }
            match => { "message" => "\[.*?\]%{GREEDYDATA:log_message}" }
            add_tag => [ "CP31_GRO01" ]
        }

        date {
            timezone => "Europe/Amsterdam"
            match => [ "timestamp" ,
                       "ISO8601",
                       "yyyy/MM/dd HH:mm:ss.SSSZ",
                       "yyyy-MM-dd HH:mm:ss.SSSZ"
                     ]
            remove_field => [ "timestamp" ]       # cleanup, data is available in @timestamp
            add_tag => [ "CP31_DAT01" ]
        }
    }
}
