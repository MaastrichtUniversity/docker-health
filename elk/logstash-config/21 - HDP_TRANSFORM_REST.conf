filter {
    if "TRANSFORM_REST" in [tags] {

        mutate {
            add_field => { "logtrail" => "hdp-transform-rest" }
            add_tag => [ "CP21_MUT01" ]
        }

        grok {
            break_on_match => true
             # DRY_RUN parsing
             # formatted all statements
             match => { "message" => "^\[%{DATA:dry_run}\]\[%{TIMESTAMP_ISO8601:timestamp}\]\[%{DATA:transform.api_method}\]\[%{DATA:level}\] - %{GREEDYDATA:log_message}" }

             match => { "message" => "^\[%{DATA:dry_run}\]%{TIMESTAMP_ISO8601:timestamp}\s%{DATA:level}\s%{GREEDYDATA:log_message}" }
             match => { "message" => "\[%{DATA:dry_run}\]\[.*?\]%{GREEDYDATA:log_message}" }

             # formatted all statements
             match => { "message" => "^\[%{TIMESTAMP_ISO8601:timestamp}\]\[%{DATA:transform.api_method}\]\[%{DATA:level}\] - %{GREEDYDATA:log_message}" }

             match => { "message" => "^%{TIMESTAMP_ISO8601:timestamp}\s%{DATA:level}\s%{GREEDYDATA:log_message}" }
             match => { "message" => "\[.*?\]%{GREEDYDATA:log_message}" }

            add_tag => [ "CP21_GRO01" ]
        }

        date {
            timezone => "Europe/Amsterdam"
            match => [ "timestamp" ,
                       "ISO8601",
                       "yyyy/MM/dd HH:mm:ss.SSSZ",
                       "yyyy-MM-dd HH:mm:ss.SSSZ"
                     ]
            remove_field => [ "timestamp" ]       # cleanup, data is available in @timestamp
            add_tag => [ "CP21_DAT01" ]
        }
    }
}
