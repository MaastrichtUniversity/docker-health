filter {
    if "EHRDB" in [tags] {

        mutate {
            add_field => { "logtrail" => "hdp-ehrdb" }
            add_tag => [ "CP25_MUT01" ]
        }

        grok {
            break_on_match => true
            match => { "message" => "^%{TIMESTAMP_ISO8601:timestamp} +%{DATA:timezone} +\[%{NUMBER:ehrdb.postgres_pid}\] +%{DATA:level}: +%{GREEDYDATA:log_message}" }
            add_tag => [ "CP25_GRO01" ]
        }

        date {
            timezone => "Europe/Amsterdam"
            match => [ "timestamp" ,
                       "ISO8601",
                       "yyyy/MM/dd HH:mm:ss.SSSZ",
                       "yyyy-MM-dd HH:mm:ss.SSSZ"
                     ]
            remove_field => [ "timestamp" ]       # cleanup, data is available in @timestamp
            add_tag => [ "CP25_DAT01" ]
        }
    }
}
