api:
  dashboard: true
  insecure: true

ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.dashboard.local.dh.unimaas.nl`)
    entryPoints:
      - web

ports:
  web:
    port: 80
    hostPort: 80
    expose:
      default: true
    exposedPort: 80

providers:
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true

gateway:
  namespacePolicy: All
  listeners:
    web:
      port: 80
      protocol: HTTP

log:
  level: INFO

accessLog:
  enabled: true
