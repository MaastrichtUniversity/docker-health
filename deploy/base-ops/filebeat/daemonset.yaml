apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  labels:
    k8s-app: filebeat
spec:
  selector:
    matchLabels:
      k8s-app: filebeat
  template:
    metadata:
      labels:
        k8s-app: filebeat
    spec:
      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: filebeat
        image: elastic/filebeat:9.1.5
        args: [
          "-c", "/etc/filebeat.yml",
          "-e",
        ]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          runAsUser: 0 # Filebeat needs to run as root to read the Docker container logs
        resources:
          limits:
            cpu: 200m
            memory: 500Mi
          requests:
            cpu: 100m
            memory: 200Mi
        volumeMounts:
        - name: config
          mountPath: /etc/filebeat.yml
          readOnly: true
          subPath: filebeat.yml
        - name: data
          mountPath: /usr/share/filebeat/data
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: usrlog
          mountPath: /usr/share/logs
          readOnly: true
        - name: filebeat-certificate-authorities
          mountPath: /etc/filebeat_ssl/ca.crt
          readOnly: true
          subPath: ca.crt
        - name: filebeat-certificate
          mountPath: /etc/filebeat_ssl/filebeat.dh-health-ops.crt
          readOnly: true
          subPath: filebeat.dh-health-ops.crt
        - name: filebeat-key
          mountPath: /etc/filebeat_ssl/filebeat.dh-health-ops.key
          readOnly: true
          subPath: filebeat.dh-health-ops.key
      volumes:
      - name: config
        configMap:
          defaultMode: 0640
          name: filebeat-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: usrlog
        hostPath:
          path: /usr/share/logs
      # data folder stores a registry of read status for all files, so we don't send everything again on a Filebeat pod restart
      - name: data
        hostPath:
          # When filebeat runs as non-root user, this directory needs to be writable by group (g+w).
          path: /var/lib/filebeat-data
          type: DirectoryOrCreate
      # SSL
      - name: filebeat-certificate-authorities
        secret:
          defaultMode: 0640
          secretName: filebeat-certificate-authorities
      - name: filebeat-certificate
        secret:
          defaultMode: 0640
          secretName: filebeat-certificate
      - name: filebeat-key
        secret:
          defaultMode: 0640
          secretName: filebeat-key
