apiVersion: apps/v1
kind: Deployment
metadata:
  name: federation-rest
  labels:
    app: federation-rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: federation-rest
  template:
    metadata:
      labels:
        app: federation-rest
    spec:
      containers:
        - name: federation-rest
          image: registry.prod.dh.unimaas.nl/docker-health/federation-rest:latest
          ports:
            - containerPort: 8000
          env:
            # EHRBASE
            - name: EHRBASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ehrbase-creds
                  key: username
            - name: EHRBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ehrbase-creds
                  key: password
            - name: EHRBASE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: etl-config-base
                  key: EHRBASE_BASE_URL
            # Service
            - name: NODENAME
              valueFrom:
                configMapKeyRef:
                  name: etl-config-node
                  key: NODENAME
            - name: FEDERATION_CLIENT_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: federation-key
                  key: key
            - name: FEDERATION_CLIENT_ACCOUNT_BTG_KEY
              valueFrom:
                secretKeyRef:
                  name: federation-break-the-glass-key
                  key: key
            - name: FEDERATION_SERVICE_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: federation-service-creds
                  key: key
          envFrom:
            - configMapRef:
                name: timezone-config
            - configMapRef:
                name: federation-rest-config-node