apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl-zib-rest
  labels:
    app: etl-zib-rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etl-zib-rest
  template:
    metadata:
      labels:
        app: etl-zib-rest
    spec:
      containers:
      - name: etl-zib-rest
        image: registry.prod.dh.unimaas.nl/docker-health/etl-zib-rest:latest
        envFrom:
        - configMapRef:
            name: dry-run-config
        - configMapRef:
            name: timezone-config
        - configMapRef:
            name: zib-templates-config
        - configMapRef:
            name: etl-config-base
        - configMapRef:
            name: etl-config-node
        env:
        - name: DATA_ENCRYPTION_PASSPHRASE
          valueFrom:
            secretKeyRef:
              name: etl-data-encryption-passphrase
              key: passphrase
        - name: EHRBASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: ehrbase-creds
              key: username
        - name: EHRBASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ehrbase-creds
              key: password
        - name: TRANSFORM_SPRING_USERNAME
          valueFrom:
            secretKeyRef:
              name: transform-creds
              key: username
        - name: TRANSFORM_SPRING_PASSWORD
          valueFrom:
            secretKeyRef:
              name: transform-creds
              key: password