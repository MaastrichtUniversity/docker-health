apiVersion: batch/v1
kind: Job
metadata:
  name: etl-zib-pipeline
  labels:
    app: etl-zib-pipeline
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: etl-zib-pipeline
    spec:
      restartPolicy: Never
      initContainers:
      - name: wait-terminology-proxy
        image: registry.prod.dh.unimaas.nl/docker-health/init-container:latest
        imagePullPolicy: IfNotPresent
        command:
          - "/wait-for-service.sh"
          - "http://terminology-server-proxy:8080/management/health"
          - "Terminology server proxy"
      - name: wait-ehrbase
        image: registry.prod.dh.unimaas.nl/docker-health/init-container:latest
        imagePullPolicy: IfNotPresent
        command:
          - "/wait-for-service.sh"
          - "http://ehrbase:8080/ehrbase/management/health"
          - "EHRbase"
      - name: wait-transform-rest
        image: registry.prod.dh.unimaas.nl/docker-health/init-container:latest
        imagePullPolicy: IfNotPresent
        command:
          - "/wait-for-service.sh"
          - "http://transform-rest:8080/management/health"
          - "Transform REST"
      containers:
      - name: etl-zib-pipeline
        image: registry.prod.dh.unimaas.nl/docker-health/etl-zib-pipeline:latest
        envFrom:
        - configMapRef:
            name: dry-run-config
        - configMapRef:
            name: timezone-config
        - configMapRef:
            name: zib-templates-config
        - configMapRef:
            name: etl-config-base
        - configMapRef:
            name: etl-config-node
        env:
        - name: DATA_ENCRYPTION_PASSPHRASE
          valueFrom:
            secretKeyRef:
              name: etl-data-encryption-passphrase
              key: passphrase
        - name: EHRBASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: ehrbase-creds
              key: username
        - name: EHRBASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ehrbase-creds
              key: password
        - name: TRANSFORM_SPRING_USERNAME
          valueFrom:
            secretKeyRef:
              name: transform-creds
              key: username
        - name: TRANSFORM_SPRING_PASSWORD
          valueFrom:
            secretKeyRef:
              name: transform-creds
              key: password