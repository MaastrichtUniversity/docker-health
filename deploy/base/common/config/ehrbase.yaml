apiVersion: v1
kind: ConfigMap
metadata:
  name: ehrbase-config
data:
  SECURITY_AUTHTYPE: BASIC
  # MANAGEMENT_ENDPOINT 'health' needs to be enabled for livenessProbe and readinessProbe of the ehrbase pods 
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE: health
  MANAGEMENT_ENDPOINTS_WEB_BASEPATH: /management
  MANAGEMENT_ENDPOINTS_WEB_ACCESS: PUBLIC
  MANAGEMENT_ENDPOINT_HEALTH_ACCESS: read_only
  # Configure FHIR Terminology Validation Server
  VALIDATION_EXTERNALTERMINOLOGY_ENABLED: "true"
  VALIDATION_EXTERNALTERMINOLOGY_FAILONERROR: "true"
  VALIDATION_EXTERNALTERMINOLOGY_PROVIDER_FHIRTERMINOLOGYSERVER_TYPE: fhir
  # VALIDATION_EXTERNALTERMINOLOGY_PROVIDER_FHIRTERMINOLOGYSERVER_URL stored in each individual node
