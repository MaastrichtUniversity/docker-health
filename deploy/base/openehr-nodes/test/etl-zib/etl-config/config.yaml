# Separated from etl-zib on test folder, because we want to include this config in test-single-node overlay,
# but exclude the test-etl-zib service
apiVersion: v1
kind: ConfigMap
metadata:
  name: etl-config-node
data:
  NODENAME: test
  DATASET_FOLDER_NAME: test-demo-data
  SOURCE_SYSTEM_ID: DEMO_DATA
  INPUT_FORMAT: csv
  LOGGER_FILENAME: logs/test/etl-zib.log
  EPIC_ON_FHIR_BASE_URL: https://epic-itc-np.mumc.nl/interconnect-oauth2-tst
  EPIC_ON_FHIR_CLIENT_ID: "28bb8481-e3fd-44b5-8374-ac1c8ad7b0b6"  # non-prd
  EPIC_ON_FHIR_JWK_SET_URL: "https://datahubmaastricht.nl/files/jwks-non-prod-mumc.json"
  EPIC_ON_FHIR_PRIVATE_KEY_PEM_PATH: "/etc/epic/privatekey.pem" # must match secret "epic-cert" mountPath
  NEDAP_CERT_BASE_URL: https://api-development.ons.io
  WRITE_COMPOSITION: "False"
  # If SUBJECT_IDS is empty, extract subject_ids from dataset:
  SUBJECT_IDS: |
    []
  TEMPLATE_IDS: |
    [
      "DataHub-Ademhaling-2024",
      "DataHub-AlcoholGebruik-2024",
      "DataHub-Bloeddruk-2024",
      "DataHub-BurgerlijkeStaat-2024",
      "DataHub-Contactpersoon-2024",
      "DataHub-Diagnose-2024",
      "DataHub-DrugsGebruik-2024",
      "DataHub-FunctieHoren-2024",
      "DataHub-FunctieZien-2024",
      "DataHub-Gezinssituatie-2024",
      "DataHub-Hartfrequentie-2024",
      "DataHub-InformedConsent",
      "DataHub-Lichaamsgewicht-2024",
      "DataHub-Lichaamslengte-2024",
      "DataHub-Lichaamstemperatuur-2024",
      "DataHub-Mobiliteit-2024",
      "DataHub-O2Saturatie-2024",
      "DataHub-ParticipatieInMaatschappij-2024",
      "DataHub-Patient-2024",
      "DataHub-Polsfrequentie-2024",
      "DataHub-TabakGebruik-2024",
      "DataHub-VermogenTotZichWassen-2024",
