apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ehrdb
spec:
  template:
    spec:
      initContainers:
        - name: init-log-dir
          volumeMounts:
            - name: postgres-logs
              mountPath: /var/log/postgresql
              subPath: test/ehrdb
      containers:
        - name: ehrdb
          volumeMounts:
            - name: postgres-logs
              mountPath: /var/log/postgresql
              subPath: test/ehrdb
      volumes:
        - name: postgres-logs
          persistentVolumeClaim:
            claimName: log-pvc-test