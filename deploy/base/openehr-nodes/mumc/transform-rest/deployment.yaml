apiVersion: apps/v1
kind: Deployment
metadata:
  name: mumc-transform-rest
  labels:
    app: mumc-transform-rest
spec:
  selector:
    matchLabels:
      app: mumc-transform-rest
  template:
    metadata:
      labels:
        app: mumc-transform-rest
    spec:
      containers:
      - name: mumc-transform-rest
        image: registry.prod.dh.unimaas.nl/docker-health/transform-rest:latest
        ports:
        - containerPort: 8080
        env:
          - name: TRANSFORM_SPRING_USERNAME
            valueFrom:
              secretKeyRef:
                name: mumc-transform-creds
                key: username
          - name: TRANSFORM_SPRING_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mumc-transform-creds
                key: password
        envFrom:
        - configMapRef:
            name: dry-run-config
        - configMapRef:
            name: timezone-config
        - configMapRef:
            name: mumc-transform-rest-config
        - configMapRef:
            name: zib-templates-config
        volumeMounts:
        - name: transform-rest-logs
          mountPath: /var/log/mumc
          subPath: mumc/transform-rest
      volumes:
      - name: transform-rest-logs
        persistentVolumeClaim:
          claimName: log-pvc
