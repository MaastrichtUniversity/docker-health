apiVersion: batch/v1
kind: Job
metadata:
  name: mumc-etl-zib-pipeline
  labels:
    app: mumc-etl-zib-pipeline
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: mumc-etl-zib-pipeline
    spec:
      restartPolicy: Never
      initContainers:
      - name: wait-terminology-proxy
        image: registry.prod.dh.unimaas.nl/docker-health/init-container:latest
        imagePullPolicy: IfNotPresent
        command:
          - "/wait-for-service.sh"
          - "http://mumc-terminology-server-proxy.dh-health-mumc:8080/management/health"
          - "Terminology server proxy"
      - name: wait-ehrbase
        image: registry.prod.dh.unimaas.nl/docker-health/init-container:latest
        imagePullPolicy: IfNotPresent
        command:
          - "/wait-for-service.sh"
          - "http://mumc-ehrbase.dh-health-mumc:8080/ehrbase/management/health"
          - "EHRbase"
      - name: wait-transform-rest
        image: registry.prod.dh.unimaas.nl/docker-health/init-container:latest
        imagePullPolicy: IfNotPresent
        command:
          - "/wait-for-service.sh"
          - "http://mumc-transform-rest.dh-health-mumc:8080/management/health"
          - "Transform REST"
      containers:
      - name: mumc-etl-zib-pipeline
        image: registry.prod.dh.unimaas.nl/docker-health/etl-zib-pipeline:latest
        envFrom:
        - configMapRef:
            name: dry-run-config
        - configMapRef:
            name: timezone-config
        - configMapRef:
            name: zib-templates-config
        - configMapRef:
            name: etl-config
        - configMapRef:
            name: mumc-etl-config
        env:
        - name: DATA_ENCRYPTION_PASSPHRASE
          valueFrom:
            secretKeyRef:
              name: etl-data-encryption-passphrase
              key: passphrase
        - name: EHRBASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: mumc-ehrbase-creds
              key: username
        - name: EHRBASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mumc-ehrbase-creds
              key: password
        - name: TRANSFORM_SPRING_USERNAME
          valueFrom:
            secretKeyRef:
              name: mumc-transform-creds
              key: username
        - name: TRANSFORM_SPRING_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mumc-transform-creds
              key: password
        volumeMounts:
        - name: outputs
          mountPath: /code/outputs
          subPath: mumc/pipeline
        - name: data
          mountPath: /code/data/mumc-demo-data
        - name: etl-logs
          mountPath: /code/logs/mumc
          subPath: mumc/pipeline
      volumes:
      - name: outputs
        persistentVolumeClaim:
          claimName: output-pvc-mumc
      - name: data
        hostPath:
          path: /mnt/data/mumc-demo-data
          type: Directory
      - name: etl-logs
        persistentVolumeClaim:
          claimName: log-pvc-mumc
