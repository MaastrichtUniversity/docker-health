apiVersion: batch/v1
kind: Job
metadata:
  name: mumc-etl-zib-pipeline
  namespace: dh-health
  labels:
    app: mumc-etl-zib-pipeline
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: mumc-etl-zib-pipeline
    spec:
      restartPolicy: Never
      initContainers:
      - name: wait-mumc-ehrbase-healthy
        image: busybox:1.28
        imagePullPolicy: IfNotPresent
        command:
          - sh
          - -c
          - |
            N_ATTEMPTS_EHRBASE=20
            N_SLEEP_EHRBASE=10
            N_ATTEMPTS_TRANSFORM=10
            N_SLEEP_TRANSFORM=5
            
            # Step 1: Wait for EHRbase
            for i in $(seq 1 $N_ATTEMPTS_EHRBASE); do
              echo "Waiting for EHRbase"
              sleep $N_SLEEP_EHRBASE
              if wget -T5 -qO- -Y off mumc-ehrbase.dh-health:8080/ehrbase/management/health | grep UP; then
                echo "EHRbase is healthy!"
              
                # Step 2: Wait for Transform REST
                for j in $(seq 1 $N_ATTEMPTS_TRANSFORM); do
                  echo "Waiting for Transform REST"
                  sleep $N_SLEEP_TRANSFORM
                  if wget -T5 -qO- -Y off mumc-transform-rest.dh-health:8080/management/health | grep UP; then
                    echo "Transform REST is healthy!"
                    exit 0
                  fi
                done
                
                echo "Transform REST failed health check after $N_ATTEMPTS_TRANSFORM attempts"
                exit 1
              fi
            done
            
            echo "EHRbase failed health check after $N_ATTEMPTS_EHRBASE attempts"
            exit 1
      containers:
      - name: mumc-etl-zib-pipeline
        image: registry.prod.dh.unimaas.nl/docker-health/etl-zib-pipeline:latest
        envFrom:
        - configMapRef:
            name: dry-run-config
        - configMapRef:
            name: timezone-config
        - configMapRef:
            name: zib-templates-config
        - configMapRef:
            name: etl-config
        - configMapRef:
            name: mumc-etl-config
        env:
        - name: DATA_ENCRYPTION_PASSPHRASE
          valueFrom:
            secretKeyRef:
              name: etl-data-encryption-passphrase
              key: passphrase
        - name: EHRBASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: mumc-ehrbase-creds
              key: username
        - name: EHRBASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mumc-ehrbase-creds
              key: password
        - name: TRANSFORM_SPRING_USERNAME
          valueFrom:
            secretKeyRef:
              name: mumc-transform-creds
              key: username
        - name: TRANSFORM_SPRING_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mumc-transform-creds
              key: password
        volumeMounts:
        - name: outputs
          mountPath: /code/outputs
          subPath: mumc/pipeline
        - name: data
          mountPath: /code/data/mumc-demo-data
        - name: etl-logs
          mountPath: /code/logs/mumc
          subPath: mumc/pipeline
      volumes:
      - name: outputs
        persistentVolumeClaim:
          claimName: output-pvc
      - name: data
        hostPath:
          path: /mnt/data/mumc-demo-data
          type: Directory
      - name: etl-logs
        persistentVolumeClaim:
          claimName: log-pvc
