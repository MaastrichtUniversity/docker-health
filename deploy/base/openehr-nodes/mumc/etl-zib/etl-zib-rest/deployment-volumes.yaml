apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl-zib-rest   # exact name used in the base deployment
spec:
  template:
    spec:
      # ---- volume definitions ----
      volumes:
        - name: outputs
          persistentVolumeClaim:
            claimName: output-pvc-mumc
        - name: etl-logs
          persistentVolumeClaim:
            claimName: log-pvc-mumc
      # ---- mount points ----
      containers:
        - name: etl-zib-rest
          volumeMounts:
            - name: outputs
              mountPath: /code/outputs
              subPath: mumc/etl-rest
            - name: etl-logs
              mountPath: /code/logs/mumc
              subPath: mumc/etl-rest

