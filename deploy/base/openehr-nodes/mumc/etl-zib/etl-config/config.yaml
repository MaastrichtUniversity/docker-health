apiVersion: v1
kind: ConfigMap
metadata:
  name: mumc-etl-config
  namespace: dh-health
data:
  NODENAME: mumc
  DATASET_FOLDER_NAME: mumc-demo-data
  SOURCE_SYSTEM_ID: SAP_ZIBDOCDATA # SAP
  LOGGER_FILENAME: logs/mumc/etl-zib.log
  EHRBASE_BASE_URL: http://mumc-ehrbase.dh-health:8080/ehrbase/rest/openehr/v1
  TRANSFORM_SPRING_BASE_URL: http://mumc-transform-rest.dh-health:8080
  WRITE_COMPOSITION: "true"
  # Specify the SUBJECT_IDS for MUMC manually as a control.
  SUBJECT_IDS: '["999999801","999990202","999990603"]'
  TEMPLATE_IDS: |
    [
      "DataHub-InformedConsent",
      "DataHub-TabakGebruik-2024"
    ]
