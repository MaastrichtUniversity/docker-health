apiVersion: apps/v1
kind: Deployment
metadata:
  name: federation-rest
spec:
  template:
    spec:
      # ── Container‑level volume mounts ───────────────────────────────────────
      containers:
        - name: federation-rest
          volumeMounts:
            - name: logs
              mountPath: /code/logs/mumc
              subPath: federation-rest
      # ── Pod‑level volume definitions ───────────────────────────────────────
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: log-pvc-mumc