apiVersion: apps/v1
kind: Deployment
metadata:
  name: ehrbase               # must match the Deployment name in deployment.yaml
spec:
  template:
    spec:
      # ── init container ──
      initContainers:
        - name: init-log-dir
          volumeMounts:
            - name: ehrbase-logs
              mountPath: /var/log/ehrbase
              subPath: vitala/ehrbase

      # ── main container ──
      containers:
        - name: ehrbase
          volumeMounts:
            - name: ehrbase-logs
              mountPath: /var/log/ehrbase
              subPath: vitala/ehrbase

      # ── PVC definition ──
      volumes:
        - name: ehrbase-logs
          persistentVolumeClaim:
            claimName: log-pvc-vitala