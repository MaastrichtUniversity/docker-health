apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitala-terminology-server-proxy
  labels:
    app: vitala-terminology-server-proxy
spec:
  selector:
    matchLabels:
      app: vitala-terminology-server-proxy
  template:
    metadata:
      labels:
        app: vitala-terminology-server-proxy
    spec:
      containers:
      - name: vitala-terminology-server-proxy
        image: registry.prod.dh.unimaas.nl/docker-health/terminology-server-proxy:latest
        ports:
        - containerPort: 8080
        envFrom:
          - configMapRef:
              name: vitala-terminology-server-proxy-config
          - configMapRef:
              name: terminology-server-proxy-config
          - configMapRef:
              name: dry-run-config
          - configMapRef:
              name: timezone-config
        env:
          - name: TERMINOLOGY_USERNAME
            valueFrom:
              secretKeyRef:
                name: terminology-server-proxy-creds
                key: username
          - name: TERMINOLOGY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: terminology-server-proxy-creds
                key: password
        volumeMounts:
          - name: terminology-logs
            mountPath: /opt/app/logs/vitala
            subPath: vitala/terminology
      volumes:
        - name: terminology-logs
          persistentVolumeClaim:
            claimName: log-pvc-vitala