apiVersion: v1
kind: ConfigMap
metadata:
  name: etl-config-node
data:
  NODENAME: vitala
  DATASET_FOLDER_NAME: vitala-demo-data
  SOURCE_SYSTEM_ID: "Nedap Ons"
  INPUT_FORMAT: "fhir"
  LOGGER_FILENAME: logs/vitala/etl-zib.log
  WRITE_COMPOSITION: "true"
  # If SUBJECT_IDS is empty, extract subject_ids from dataset:
  SUBJECT_IDS: |
    []
  TEMPLATE_IDS: |
    []