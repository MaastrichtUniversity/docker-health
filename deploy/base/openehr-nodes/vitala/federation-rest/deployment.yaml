apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitala-federation-rest
  namespace: dh-health
  labels:
    app: vitala-federation-rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vitala-federation-rest
  template:
    metadata:
      labels:
        app: vitala-federation-rest
    spec:
      containers:
        - name: vitala-federation-rest
          image: registry.prod.dh.unimaas.nl/docker-health/federation-rest:latest
          ports:
            - containerPort: 8000
          env:
            # EHRBASE
            - name: EHRBASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vitala-ehrbase-creds
                  key: username
            - name: EHRBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vitala-ehrbase-creds
                  key: password
            - name: EHRBASE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: vitala-etl-config
                  key: EHRBASE_BASE_URL
            # Service
            - name: NODENAME
              valueFrom:
                configMapKeyRef:
                  name: vitala-etl-config
                  key: NODENAME
            - name: FEDERATION_CLIENT_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: vitala-federation-key
                  key: key
            - name: FEDERATION_CLIENT_ACCOUNT_BTG_KEY
              valueFrom:
                secretKeyRef:
                  name: vitala-federation-break-the-glass-key
                  key: key
            - name: FEDERATION_SERVICE_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: federation-service-creds
                  key: key
          envFrom:
            - configMapRef:
                name: timezone-config
            - configMapRef:
                name: vitala-federation-rest-config
          volumeMounts:
            - name: logs
              mountPath: /code/logs/federation-rest
              subPath: vitala/federation-rest
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: log-pvc