apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitala-transform-rest
  labels:
    app: vitala-transform-rest
spec:
  selector:
    matchLabels:
      app: vitala-transform-rest
  template:
    metadata:
      labels:
        app: vitala-transform-rest
    spec:
      containers:
      - name: vitala-transform-rest
        image: registry.prod.dh.unimaas.nl/docker-health/transform-rest:latest
        ports:
        - containerPort: 8080
        env:
          - name: TRANSFORM_SPRING_USERNAME
            valueFrom:
              secretKeyRef:
                name: vitala-transform-creds
                key: username
          - name: TRANSFORM_SPRING_PASSWORD
            valueFrom:
              secretKeyRef:
                name: vitala-transform-creds
                key: password
        envFrom:
        - configMapRef:
            name: dry-run-config
        - configMapRef:
            name: timezone-config
        - configMapRef:
            name: vitala-transform-rest-config
        - configMapRef:
            name: zib-templates-config
        volumeMounts:
        - name: transform-rest-logs
          mountPath: /var/log/vitala
          subPath: vitala/transform-rest
      volumes:
      - name: transform-rest-logs
        persistentVolumeClaim:
          claimName: log-pvc-vitala
