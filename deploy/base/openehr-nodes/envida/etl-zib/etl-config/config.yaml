apiVersion: v1
kind: ConfigMap
metadata:
  name: etl-config-node
data:
  NODENAME: envida
  DATASET_FOLDER_NAME: envida-demo-data
  SOURCE_SYSTEM_ID: DEMO_DATA
  INPUT_FORMAT: csv
  LOGGER_FILENAME: logs/envida/etl-zib.log
  NEDAP_CERT_BASE_URL: https://api-development.ons.io
  NEDAP_NUMBER_PATIENT_MAX: "20"
  WRITE_COMPOSITION: "True"
  # If SUBJECT_IDS is empty, extract subject_ids from dataset:
  SUBJECT_IDS: |
    []
  TEMPLATE_IDS: |
    []
