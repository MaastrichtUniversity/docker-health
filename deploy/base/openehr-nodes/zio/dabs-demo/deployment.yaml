apiVersion: apps/v1
kind: Deployment
metadata:
  name: dabs-demo
  labels:
    app: dabs-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dabs-demo
  template:
    metadata:
      labels:
        app: dabs-demo
    spec:
      containers:
        - name: dabs-demo
          image: registry.prod.dh.unimaas.nl/docker-health/dabs-demo:latest
          ports:
            - containerPort: 8800
          env:
            - name: DABS_FEDERATION_BASE
              value: "http://federation.zio.local.dh.unimaas.nl"
            - name: DABS_KEY
              valueFrom:
                secretKeyRef:
                  name: federation-key
                  key: key
            - name: DABS_BTG_KEY
              valueFrom:
                secretKeyRef:
                  name: federation-break-the-glass-key
                  key: key
          envFrom:
            - configMapRef:
                name: timezone-config
            - configMapRef:
                name: timezone-config