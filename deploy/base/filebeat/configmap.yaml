apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: kube-system
  labels:
    k8s-app: filebeat
    # Terminology
    # Transform
    # Jupyter
data:
  filebeat.yml: |-
    filebeat.inputs:
    - type: filestream
      id: kubernetes-container-logs
      paths:
        - /var/log/containers/*.log
      parsers:
        - container: ~
      prospector:
        scanner:
          fingerprint.enabled: true
          symlinks: true
      file_identity.fingerprint: ~
      processors:
        - add_kubernetes_metadata:
            host: ${NODE_NAME}
            matchers:
            - logs_path:
                logs_path: "/var/log/containers/"
    - type: log
      enabled: true
      paths:
        - /usr/share/logs/mumc/pipeline/etl-zib.log
        - /usr/share/logs/mumc/ehrdb/postgresql.log
      multiline:
        pattern: '^\['
        negate: true
        match: after
      tags: ["MUMC","POSTGRESQL","ETL_ZIB"]
    - type: log
      enabled: true
      paths:
        - /usr/share/logs/envida/pipeline/etl-zib.log
        - /usr/share/logs/envida/ehrdb/postgresql.log
      multiline:
        pattern: '^\['
        negate: true
        match: after
      tags: ["ENVIDA","POSTGRESQL","ETL_ZIB"]
    - type: log
      enabled: true
      paths:
        - /usr/share/logs/zio/pipeline/etl-zib.log
        - /usr/share/logs/zio/ehrdb/postgresql.log
      multiline:
        pattern: '^\['
        negate: true
        match: after
      tags: ["ZIO","POSTGRESQL","ETL_ZIB"]
    - type: log
      enabled: true
      paths:
        - /usr/share/logs/test/pipeline/etl-zib.log
        - /usr/share/logs/test/ehrdb/postgresql.log
      multiline:
        pattern: '^\['
        negate: true
        match: after
      tags: ["TEST","POSTGRESQL","ETL_ZIB"]
    - type: log
      enabled: true
      paths:
        - /usr/share/logs/vitala/pipeline/etl-zib.log
        - /usr/share/logs/vitala/ehrdb/postgresql.log
      multiline:
        pattern: '^\['
        negate: true
        match: after
      tags: ["VITALA","POSTGRESQL","ETL_ZIB"]
    - type: log
      enabled: true
      paths:
        - /usr/share/logs/federation/federation-rest.log
      multiline:
        pattern: '^\['
        negate: true
        match: after
      tags: ["FEDERATION_REST"]
    processors:
      - add_cloud_metadata:
      - add_host_metadata:
    output.logstash:
      hosts: ["elk.dh-health-ops:5044"]