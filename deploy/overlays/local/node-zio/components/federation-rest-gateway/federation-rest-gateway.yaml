apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: zio-federation-rest-gateway
  namespace: dh-health
spec:
  gatewayClassName: traefik
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: federation.zio.local.dh.unimaas.nl
    - name: http
      port: 80
      protocol: HTTP
      hostname: federation.zio.local.dh.unimaas.nl
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zio-federation-rest-route
  namespace: dh-health
spec:
  parentRefs:
    - name: zio-federation-rest-gateway
  hostnames:
    - federation.zio.local.dh.unimaas.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zio-federation-rest
          port: 8000
