apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: zio-terminology-server-proxy-gateway
  namespace: dh-health
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: terminology.zio.local.dh.unimaas.nl
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zio-terminology-server-proxy-route
  namespace: dh-health
spec:
  parentRefs:
    - name: zio-terminology-server-proxy-gateway
  hostnames:
    - terminology.zio.local.dh.unimaas.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zio-terminology-server-proxy
          port: 8080
