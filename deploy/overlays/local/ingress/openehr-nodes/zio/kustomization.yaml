apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - ehrbase-ingress.yaml
  - etl-zib-rest-ingress.yaml
  - openehrtool-ingress.yaml
  - portal-ingress.yaml
  - transform-rest-ingress.yaml

secretGenerator:
  - name: zio-ehrbase-creds
    namespace: dh-health
    literals:
      - username=user2
      - password=foobar2
  - name: zio-ehrbase-admin-creds
    namespace: dh-health
    literals:
      - username=admin2
      - password=admin2
  - name: zio-ehrbase-db-admin-creds
    namespace: dh-health
    literals:
      - username=ehrbase2
      - password=ehrbase2
  - name: zio-ehrbase-db-creds
    namespace: dh-health
    literals:
      - username=ehrbase_restricted2
      - password=ehrbase_restricted2
  - name: zio-portal-creds
    namespace: dh-health
    literals:
      - username=demo@zio.nl
      - password=foobar
  - name: zio-federation-key
    namespace: dh-health
    literals:
      - key=key2
  - name: zio-federation-break-the-glass-key
    namespace: dh-health
    literals:
      - key=btgkey2
  - name: zio-ehrbase-db-postgres-creds
    namespace: dh-health
    literals:
      - username=postgres
      - password=postgres
  - name: zio-transform-creds
    namespace: dh-health
    options:
      labels:
        ehrnode: zio-node
    literals:
      - username=transform2
      - password=transform2
