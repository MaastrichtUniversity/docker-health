apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- ../../../base/elk
- ../../../base/filebeat

patches:
# imagePullPolicy patches
- target:
    kind: Deployment
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Never

# Individual ingress host patches
## ELK (Kibana)
- target:
    group: networking.k8s.io
    version: v1
    kind: Ingress
    name: elk-ingress
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: elk.local.dh.unimaas.nl


secretGenerator:
# Filebeat
  - name: filebeat-certificate-authorities
    namespace: dh-health-ops
    files:
        -  certs/ca.crt
  - name: filebeat-certificate
    namespace: dh-health-ops
    files:
        -  certs/filebeat.dh-health-ops.crt
  - name: filebeat-key
    namespace: dh-health-ops
    files:
        -  certs/filebeat.dh-health-ops.key
# Logstash (ELK)
  - name: logstash-certificate-authorities
    namespace: dh-health-ops
    files:
        -  certs/ca.crt
  - name: logstash-certificate
    namespace: dh-health-ops
    files:
        -  certs/elk.dh-health-ops.crt
  - name: logstash-key
    namespace: dh-health-ops
    files:
        -  certs/elk.dh-health-ops.key