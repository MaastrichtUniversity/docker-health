apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dh-health-jupyter

resources:
  - namespace.yaml
  - jupyter-zib-gateway.yaml
  - ../../../base/jupyter-zib
  - ../node-envida/prefix
  - ../node-mumc/prefix
  - ../node-vitala/prefix
  - ../node-zio/prefix

components:
  - ../shared-components


patches:
  # imagePullPolicy patches
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never


secretGenerator:
  - name: jupyter-zib-creds
    literals:
      - SERVER_APP_TOKEN=aa3ca297f81ed69a3fcab71ff886d5cf3207be09960f6de7
