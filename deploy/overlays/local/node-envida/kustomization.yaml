apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dh-health-envida

resources:
  - ../../../base/openehr-nodes/envida
  - config
  - service-discovery

components:
  - components
  - ../shared-components
  - certs

patches:
  # imagePullPolicy patches
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Job
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
secretGenerator:
  - name: nedap-cert
    namespace: dh-health
    files:
        - certs/envida_dabs-TE1002-development.pfx
