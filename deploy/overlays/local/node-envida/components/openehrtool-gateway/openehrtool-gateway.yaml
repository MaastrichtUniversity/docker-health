apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envida-openehrtool-gateway
  namespace: dh-health
spec:
  gatewayClassName: traefik
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: openehrtool.envida.local.dh.unimaas.nl
    - name: http
      port: 80
      protocol: HTTP
      hostname: openehrtool.envida.local.dh.unimaas.nl
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: envida-openehrtool-route
  namespace: dh-health
spec:
  parentRefs:
    - name: envida-openehrtool-gateway
  hostnames:
    - openehrtool.envida.local.dh.unimaas.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: envida-openehrtool
          port: 9000
