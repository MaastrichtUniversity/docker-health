apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/jupyter-zib
  - ../../base/openehr-nodes/envida
  - ../../base/openehr-nodes/mumc
  - ../../base/openehr-nodes/vitala
  - ../../base/openehr-nodes/zio
  - ../../base/openehr-nodes/test

components:
  - components/jupyter-zib-ingress
  - node-envida/components
  - node-mumc/components
  - node-vitala/components
  - node-zio/components
  - node-test/components

patches:
  # imagePullPolicy patches
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Job
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never

secretGenerator:
  - name: federation-service-creds
    namespace: dh-health
    literals:
      - key=serviceKey
