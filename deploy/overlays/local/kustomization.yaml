apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - jupyter
  - node-envida
  - node-mumc
  - node-vitala
  - node-zio

patches:
  # imagePullPolicy patches
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Job
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
