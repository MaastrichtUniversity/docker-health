apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base/common/
- ../../base/jupyter-zib/
- ../../base/terminology-server-proxy/
- ../../base/openehr-nodes/envida/
- ../../base/openehr-nodes/mumc/
- ../../base/openehr-nodes/vitala/
- ../../base/openehr-nodes/zio/
- ../../base/openehr-nodes/test/

components:
  - ingress/jupyter-zib/
  - ingress/terminology-server-proxy/
  - ingress/openehr-nodes/envida/
  - ingress/openehr-nodes/mumc/
  - ingress/openehr-nodes/vitala/
  - ingress/openehr-nodes/zio/

patches:
# imagePullPolicy patches
- target:
    kind: Deployment
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Never
- target:
    kind: Job
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Never

configMapGenerator:
# Set ADMIN_API_ACTIVE: "true" in all nodes for development purposes for openEHRtool ADMIN methods.
- name: ehrbase-config
  namespace: dh-health
  behavior: merge
  literals:
    - ADMIN_API_ACTIVE=true
