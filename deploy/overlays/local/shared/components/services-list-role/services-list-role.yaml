kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: services-list
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: services-list-binding
  namespace: dh-health
subjects:
- kind: ServiceAccount
  name: default
  namespace: dh-health
roleRef:
  kind: ClusterRole
  name: services-list
  apiGroup: rbac.authorization.k8s.io
