apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/common
  - ../../../base/terminology-server-proxy

components:
  - ../components/services-list-role # For the service registry
  - ../components/terminology-server-proxy-ingress
  - ../components/federation

patches:
  # imagePullPolicy patches
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never

configMapGenerator:
  # Set ADMIN_API_ACTIVE: "true" in all nodes for development purposes for openEHRtool ADMIN methods.
  - name: ehrbase-config
    namespace: dh-health
    behavior: merge
    literals:
      - ADMIN_API_ACTIVE=true
