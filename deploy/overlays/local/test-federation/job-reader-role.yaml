apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-reader
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: read-jobs-binding
subjects:
- kind: ServiceAccount
  name: default
  namespace: dh-health
roleRef:
  kind: ClusterRole
  name: job-reader
  apiGroup: rbac.authorization.k8s.io
