apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dh-health-mumc

resources:
  # MUMC-node
  - ../../../../../base/openehr-nodes/mumc/ehrbase
  - ../../../../../base/openehr-nodes/mumc/ehrdb
  - ../../../../../base/openehr-nodes/mumc/etl-zib
  - ../../../../../base/openehr-nodes/mumc/federation-rest
  - ../../../../../base/openehr-nodes/mumc/terminology-server-proxy
  - ../../../../../base/openehr-nodes/mumc/transform-rest
  - ../../../../../base/openehr-nodes/mumc/volumes
  - ../../../node-mumc/service-discovery
  - ../../../node-mumc/config

components:
  - ../../../shared-components
  - ../../../certificates/epic-certificate-secret
  # MUMC-node
  - ../../../node-mumc/components/ehrbase-gateway
  - ../../../node-mumc/components/federation-rest-gateway
  - ../../../node-mumc/components/transform-rest-gateway
  - ../../../node-mumc/components/terminology-server-proxy-gateway
  - ../../../node-mumc/components/secrets

patches:
  # imagePullPolicy patches
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Job
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
