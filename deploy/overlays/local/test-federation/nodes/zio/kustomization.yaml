apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dh-health-zio

resources:
  - ../../../shared
  # ZIO-node
  - ../../../../../base/openehr-nodes/zio/ehrbase
  - ../../../../../base/openehr-nodes/zio/ehrdb
  - ../../../../../base/openehr-nodes/zio/etl-zib
  - ../../../../../base/openehr-nodes/zio/federation-rest
  - ../../../../../base/openehr-nodes/zio/terminology-server-proxy
  - ../../../../../base/openehr-nodes/zio/transform-rest
  - ../../../../../base/openehr-nodes/zio/volumes
  - ../../../node-zio/service-discovery
  - ../../../node-zio/config

components:
  # ZIO-node
  - ../../../node-zio/components/ehrbase-gateway
  - ../../../node-zio/components/federation-rest-gateway
  - ../../../node-zio/components/transform-rest-gateway
  - ../../../node-zio/components/terminology-server-proxy-gateway
  - ../../../node-zio/components/secrets

patches:
  # imagePullPolicy patches
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Job
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
