apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dh-health-test-federation

resources:
  - namespace.yaml
  - ../../../../base/base-config
  - job.yaml
  - job-reader-role.yaml
  - ../../node-envida/prefix
  - ../../node-mumc/prefix
  - ../../node-vitala/prefix
  - ../../node-zio/prefix

patches:
  # imagePullPolicy patches
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Job
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
