apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - ../../../base/base-config

components:
  - data-encryption-secret
  - federation-secret
# Remove "service-discovery" in the shared components list to avoid name collision
# Only one ClusterRole can exist with the same name inside the cluster (across all namespace)
# It will avoid that each node will try to create the services-list ClusterRole
#  - service-discovery
  - terminology-server-proxy-secret

patches:
  # imagePullPolicy patches
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never    

configMapGenerator:
  # Set ADMIN_API_ACTIVE: "true" in local overlay only for the usage of openEHRtool ADMIN methods.
  - name: ehrbase-config-base
    behavior: merge
    literals:
      - ADMIN_API_ACTIVE=true
