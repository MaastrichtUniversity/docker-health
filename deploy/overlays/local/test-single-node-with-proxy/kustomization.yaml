apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base-config/proxy-namespaces/dh-health-test-single-node
  - ../test-single-node

patches:
  - target:
      kind: Deployment
      name: .*terminology-server-proxy
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: proxy-config
  - target:
      kind: Job
      name: test-single-node
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: proxy-config
