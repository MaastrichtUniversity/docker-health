apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../test-single-node

patches:
  - target:
      kind: Deployment
      name: .*terminology-server-proxy
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: http_proxy
          value: http://proxy.unimaas.nl:3128
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: https_proxy
          value: http://proxy.unimaas.nl:3128
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: no_proxy
          value: 127.0.0.1,localhost,.dh.local,.unimaas.nl,.datahubmaastricht.nl,epic-pid.storage.surfsara.nl,edr-neu.eu.endpoint.security.microsoft.com,137.120.31.76,10.96.0.0/12,192.168.59.0/24,192.168.49.0/24,192.168.39.0/24