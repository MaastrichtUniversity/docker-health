apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mumc-transform-rest-gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: transform.mumc.local.dh.unimaas.nl
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mumc-transform-rest-route
spec:
  parentRefs:
    - name: mumc-transform-rest-gateway
  hostnames:
    - transform.mumc.local.dh.unimaas.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: transform-rest
          port: 8080
