apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mumc-openehrtool-gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: openehrtool.mumc.local.dh.unimaas.nl
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mumc-openehrtool-route
spec:
  parentRefs:
    - name: mumc-openehrtool-gateway
  hostnames:
    - openehrtool.mumc.local.dh.unimaas.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mumc-openehrtool
          port: 9000
