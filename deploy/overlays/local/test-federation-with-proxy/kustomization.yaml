apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../test-federation

configMapGenerator:
  - name: proxy-config
    namespace: dh-health-envida
    options:
      disableNameSuffixHash: true
    envs:
      - ../../../base-config/proxy.env
  - name: proxy-config
    namespace: dh-health-mumc
    options:
      disableNameSuffixHash: true
    envs:
      - ../../../base-config/proxy.env
  - name: proxy-config
    namespace: dh-health-vitala
    options:
      disableNameSuffixHash: true
    envs:
      - ../../../base-config/proxy.env
  - name: proxy-config
    namespace: dh-health-zio
    options:
      disableNameSuffixHash: true
    envs:
      - ../../../base-config/proxy.env

patches:
  - target:
      kind: Deployment
      name: .*terminology-server-proxy
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: proxy-config
  - target:
      kind: Job
      name: .*etl-zib-pipeline
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: proxy-config
