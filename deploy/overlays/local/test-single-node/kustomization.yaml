apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - job.yaml
  # TEST-node
  - ../../../base/openehr-nodes/test/ehrbase
  - ../../../base/openehr-nodes/test/ehrdb
  - ../../../base/openehr-nodes/test/etl-zib/etl-config
  - ../../../base/openehr-nodes/test/terminology-server-proxy
  - ../../../base/openehr-nodes/test/transform-rest

components:
  # TEST-node
  - ../node-test/components/ehrbase-gateway
  - ../node-test/components/transform-rest-gateway
  - ../node-test/components/secrets

patches:
  # imagePullPolicy patches
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Job
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never

configMapGenerator:
  - name: test-etl-config
    namespace: dh-health
    behavior: merge
    literals:
      - EHRBASE_ADMIN_BASE_URL=http://test-ehrbase.dh-health:8080/ehrbase/rest/admin
