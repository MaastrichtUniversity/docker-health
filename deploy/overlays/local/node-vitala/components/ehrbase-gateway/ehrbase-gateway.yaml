apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: vitala-ehrbase-gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: ehrbase.vitala.local.dh.unimaas.nl
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vitala-ehrbase-route 
spec:
  parentRefs:
    - name: vitala-ehrbase-gateway
  hostnames:
    - ehrbase.vitala.local.dh.unimaas.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ehrbase
          port: 8080
