apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: vitala-portal-gateway 
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: portal.vitala.local.dh.unimaas.nl
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vitala-portal-route 
spec:
  parentRefs:
    - name: vitala-portal-gateway
  hostnames:
    - portal.vitala.local.dh.unimaas.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vitala-portal
          port: 3000
