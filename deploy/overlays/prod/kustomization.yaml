apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

images:
  - name: registry.prod.dh.unimaas.nl/docker-health/federation-rest
    newTag: "2026.1.4"
  - name: registry.prod.dh.unimaas.nl/docker-health/etl-zib-rest
    newTag: "2026.1.4"
  - name: registry.prod.dh.unimaas.nl/docker-health/etl-zib-pipeline
    newTag: "2026.1.4"
  - name: registry.prod.dh.unimaas.nl/docker-health/portal
    newTag: "2026.1.4"
  - name: registry.prod.dh.unimaas.nl/docker-health/transform-rest
    newTag: "2026.1.4"
  - name: registry.prod.dh.unimaas.nl/docker-health/terminology-server-proxy
    newTag: "2026.1.4"
  - name: registry.prod.dh.unimaas.nl/docker-health/init-container
    newTag: "2026.1.4"

resources:
  - secrets.yaml
  - jupyter
  - node-envida
  - node-mumc
  - node-vitala
  - node-zio
  
generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      kind: PersistentVolume
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: local-path
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: local-path
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: registry-credentials
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: registry-credentials
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
