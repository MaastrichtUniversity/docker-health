apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mumc-portal-gateway
  namespace: dh-health
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: portal.mumc.fehr.mumc.nl
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mumc-portal-route
  namespace: dh-health
spec:
  parentRefs:
    - name: mumc-portal-gateway
  hostnames:
    - portal.mumc.fehr.mumc.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mumc-portal
          port: 3000
