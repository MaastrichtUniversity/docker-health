apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dh-health-test-single-node

resources:
- ../../../base-config/proxy
- namespace.yaml
- vault-auth.yaml
- secrets.yaml
- test-secrets.yaml
- volumes.yaml
- job.yaml
# TEST-node
- ../../../base/openehr-nodes/test/ehrbase
- ../../../base/openehr-nodes/test/ehrdb
- ../../../base/openehr-nodes/test/etl-zib/etl-config
- ../../../base/openehr-nodes/test/terminology-server-proxy
- ../../../base/openehr-nodes/test/transform-rest

components:
  - ../shared-components

images:
  - name: registry.prod.dh.unimaas.nl/docker-health/etl-zib-test
    newTag: "2026.1.4"
  - name: registry.prod.dh.unimaas.nl/docker-health/transform-rest
    newTag: "2026.1.4"
  - name: registry.prod.dh.unimaas.nl/docker-health/terminology-server-proxy
    newTag: "2026.1.4"
  - name: registry.prod.dh.unimaas.nl/docker-health/init-container
    newTag: "2026.1.4"

generatorOptions:
  disableNameSuffixHash: true

patches:
  # imagePullPolicy patches
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Job
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # Image pull secret
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/imagePullSecrets
        value:
        - name: registry-credentials
  - target:
      kind: Job
    patch: |-
      - op: replace
        path: /spec/template/spec/imagePullSecrets
        value:
        - name: registry-credentials

  # Proxy patches
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: "/spec/template/spec/containers/0/envFrom/-"
        value:
          configMapRef:
            name: proxy-config
  - target:
      kind: Job
    patch: |-
      - op: add
        path: "/spec/template/spec/containers/0/envFrom/-"
        value:
          configMapRef:
            name: proxy-config

# Set ADMIN_API_ACTIVE: "true" and ADMIN_BASE_URL for development purposes while running the tests teardown.
configMapGenerator:
  - name: etl-config-node
    behavior: merge
    literals:
      - EHRBASE_ADMIN_BASE_URL=http://ehrbase:8080/ehrbase/rest/admin
