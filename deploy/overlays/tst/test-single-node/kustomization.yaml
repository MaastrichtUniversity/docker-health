apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dh-health-test-single-node

resources:
- namespace.yaml
- vault-auth.yaml
- secrets.yaml
- test-secrets.yaml
- volumes.yaml
- job.yaml
# TEST-node
- ../../../base/openehr-nodes/test/ehrbase
- ../../../base/openehr-nodes/test/ehrdb
- ../../../base/openehr-nodes/test/etl-zib/etl-config
- ../../../base/openehr-nodes/test/terminology-server-proxy
- ../../../base/openehr-nodes/test/transform-rest

components:
  - ../shared-components

images:
- name: registry.prod.dh.unimaas.nl/docker-health/etl-zib-test
  newTag: '2026.1.3'
- name: registry.prod.dh.unimaas.nl/docker-health/transform-rest
  newTag: '2026.1.3'
- name: registry.prod.dh.unimaas.nl/docker-health/terminology-server-proxy
  newTag: '2026.1.3'
- name: registry.prod.dh.unimaas.nl/docker-health/init-container
  newTag: '2026.1.3'

generatorOptions:
  disableNameSuffixHash: true

patches:
# imagePullPolicy patches
- target:
    kind: Deployment
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
- target:
    kind: Job
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent

# Image pull secret
- target:
    kind: Deployment
  patch: |-
    - op: replace
      path: /spec/template/spec/imagePullSecrets
      value:
      - name: registry-credentials
- target:
    kind: Job
  patch: |-
    - op: replace
      path: /spec/template/spec/imagePullSecrets
      value:
      - name: registry-credentials

# Storage class patches
- target:
    kind: PersistentVolume
  patch: |-
    - op: replace
      path: /spec/storageClassName
      value: local-path
- target:
    kind: PersistentVolumeClaim
  patch: |-
    - op: replace
      path: /spec/storageClassName
      value: local-path

# Proxy patches
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: "/spec/template/spec/containers/0/envFrom/-"
      value:
        configMapRef:
          name: proxy-config

# Set ADMIN_API_ACTIVE: "true" and ADMIN_BASE_URL for development purposes while running the tests teardown.
configMapGenerator:
  - name: etl-config-node
    behavior: merge
    literals:
      - EHRBASE_ADMIN_BASE_URL=http://ehrbase:8080/ehrbase/rest/admin
  - name: proxy-config
    literals:
      - HTTP_PROXY=http://proxy.unimaas.nl:3128
      - http_proxy=http://proxy.unimaas.nl:3128
      - HTTPS_PROXY=http://proxy.unimaas.nl:3128
      - https_proxy=http://proxy.unimaas.nl:3128
      - NO_PROXY=localhost,.dh.local,.dh-health,.unimaas.nl,.datahubmaastricht.nl,137.120.31.0/24,.cluster.local,10.42.0.0/12,10.43.0.0/12,10.43.0.10,10.43.0.1
      - no_proxy=localhost,.dh.local,.dh-health,.unimaas.nl,.datahubmaastricht.nl,137.120.31.0/24,.cluster.local,10.42.0.0/12,10.43.0.0/12,10.43.0.10,10.43.0.1