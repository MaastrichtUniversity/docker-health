apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dh-health-jupyter

images:
- name: registry.prod.dh.unimaas.nl/docker-health/jupyter-zib
  newTag: '2026.1.3'

resources:
  - namespace.yaml
  - secrets
  - tls.yaml
  - jupyter-zib-gateway.yaml
  - ../../../base/jupyter-zib
  - ../node-envida/etl-config
  - ../node-mumc/etl-config
  - ../node-vitala/etl-config
  - ../node-zio/etl-config

components:
  - ../shared-components

patches:
  - target:
      kind: Deployment
      name: jupyter-zib
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
        - name: registry-credentials
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: jupyter-zib
      namespace: dh-health-jupyter
    path: patches/deployment/jupyter-delete-test-config.yaml
  # NEW: Patch the Jupyter Deployment to use /mnt/demo-data
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: jupyter-zib
    patch: |
      - op: replace
        path: /spec/template/spec/volumes/0/hostPath/path
        value: /mnt/demo-data

configMapGenerator:
- name: proxy-config
  literals:
    - HTTP_PROXY=http://proxy.unimaas.nl:3128
    - http_proxy=http://proxy.unimaas.nl:3128
    - HTTPS_PROXY=http://proxy.unimaas.nl:3128
    - https_proxy=http://proxy.unimaas.nl:3128
    - NO_PROXY=localhost,127.0.0.1,.dh.local,.dh-health,.dh-health-envida,.dh-health-vitala,.dh-health-mumc,.dh-health-zio,.dh-health-test-federation,.dh-health-test-single-node,.unimaas.nl,.datahubmaastricht.nl,epic-pid.storage.surfsara.nl,edr-neu.eu.endpoint.security.microsoft.com,137.120.31.0/24,137.120.31.76,.cluster.local,10.42.0.0/12,10.43.0.0/12,10.43.0.10,10.43.0.1,10.96.0.0/12,192.168.59.0/24,192.168.49.0/24,192.168.39.0/24
    - no_proxy=localhost,127.0.0.1,.dh.local,.dh-health,.dh-health-envida,.dh-health-vitala,.dh-health-mumc,.dh-health-zio,.dh-health-test-federation,.dh-health-test-single-node,.unimaas.nl,.datahubmaastricht.nl,epic-pid.storage.surfsara.nl,edr-neu.eu.endpoint.security.microsoft.com,137.120.31.0/24,137.120.31.76,.cluster.local,10.42.0.0/12,10.43.0.0/12,10.43.0.10,10.43.0.1,10.96.0.0/12,192.168.59.0/24,192.168.49.0/24,192.168.39.0/24