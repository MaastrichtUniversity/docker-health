apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: git-demo-data

resources:
- ../demo-data

patches:
- target:
    kind: Job
    name: populate-pvc-with-git-repo
  patch: |-
    - op: replace
      path: /spec/parallelism
      value: 2
    - op: replace
      path: /spec/completions
      value: 2
    - op: add
      path: /spec/template/spec/affinity
      value:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - fhml-srv039
                - fhml-srv075
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  job-name: populate-pvc-with-git-repo
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  job-name: populate-pvc-with-git-repo
              topologyKey: kubernetes.io/hostname