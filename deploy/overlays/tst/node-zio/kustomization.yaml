apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dh-health-zio

resources:
  - vault-auth.yaml
  - ../../../base/openehr-nodes/zio
  - config
  - service-discovery

components:
  - components
  - ../shared-components

patches:
  - target:
      group: ""
      version: v1
      kind: PersistentVolumeClaim
      name: git-repo-pvc
      namespace: dh-health-zio
    path: patches/pvc.yaml
  - target:
      group: batch
      version: v1
      kind: Job
      name: etl-zib-pipeline
      namespace: dh-health-zio
    path: patches/job/zio-etl-zib-delete-demo-data.yaml
  - target:
      group: batch
      version: v1
      kind: Job
      name: etl-zib-pipeline
      namespace: dh-health-zio
    path: patches/job/zio-etl-zib-add-demo-data.yaml
