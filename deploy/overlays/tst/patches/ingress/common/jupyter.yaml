apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyter-zib-ingress
  namespace: dh-health
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - jupyter.tst.dh.unimaas.nl
      secretName: jupyter-tls-secret
  rules:
    - host: jupyter.tst.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jupyter-zib
                port:
                  number: 8888
