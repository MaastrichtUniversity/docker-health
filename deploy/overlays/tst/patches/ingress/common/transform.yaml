apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transform-rest-ingress
  namespace: dh-health
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - transform.tst.dh.unimaas.nl
      secretName: transform-tls-secret
  rules:
    - host: transform.tst.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: transform-rest
                port:
                  number: 8080
