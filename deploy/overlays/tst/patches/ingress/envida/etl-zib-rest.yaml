apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: envida-etl-zib-rest-ingress
  namespace: dh-health
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - etl.envida.tst.dh.unimaas.nl
      secretName: etl-envida-tls-secret
  rules:
    - host: etl.envida.tst.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: envida-etl-zib-rest
                port:
                  number: 8040
