---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: log-pv-envida
  namespace: dh-health-envida
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-csi
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: nfs-envida-logs
    volumeAttributes:
      server: fhml-srv017.unimaas.nl
      share: /bkp/tst-k3s/logs/envida
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: log-pvc-envida
  namespace: dh-health-envida
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: nfs-csi
  volumeName: log-pv-envida
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: output-pv-envida
  namespace: dh-health-envida
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-csi
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: nfs-envida-outputs
    volumeAttributes:
      server: fhml-srv017.unimaas.nl
      share: /bkp/tst-k3s/outputs/envida
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: output-pvc-envida
  namespace: dh-health-envida
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: nfs-csi
  volumeName: output-pv-envida