apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

images:
  - name: registry.prod.dh.unimaas.nl/docker-health/federation-rest
    newTag: "2026.2.0"
  - name: registry.prod.dh.unimaas.nl/docker-health/etl-zib-rest
    newTag: "2026.2.0"
  - name: registry.prod.dh.unimaas.nl/docker-health/etl-zib-test
    newTag: "2026.2.0"
  - name: registry.prod.dh.unimaas.nl/docker-health/etl-zib-pipeline
    newTag: "2026.2.0"
  - name: registry.prod.dh.unimaas.nl/docker-health/portal
    newTag: "2026.2.0"
  - name: registry.prod.dh.unimaas.nl/docker-health/transform-rest
    newTag: "2026.2.0"
  - name: registry.prod.dh.unimaas.nl/docker-health/terminology-server-proxy
    newTag: "2026.2.0"
  - name: registry.prod.dh.unimaas.nl/docker-health/init-container
    newTag: "2026.2.0"

resources:
  # DHP resources
  - jupyter
  - node-envida
  - node-mumc
  - node-vitala
  - node-zio

generatorOptions:
  disableNameSuffixHash: true

patches:
  # 'Global' patches that apply to all of one sort
  # Storage class patches
  - target:
      kind: PersistentVolume
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: local-path
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: local-path
  # Image pull secret patches
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
        - name: registry-credentials
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
        - name: registry-credentials
  # imagePullPolicy patches
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
        value: IfNotPresent
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
        value: IfNotPresent
  # Proxy patches
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: "/spec/template/spec/containers/0/envFrom/-"
        value:
          configMapRef:
            name: proxy-config

  # federation-rest pods connect to the internal Kubernetes API (10.43.0.1) and
  # other in-cluster services only. Explicitly unset the proxy env vars via `env`
  # (which takes precedence over envFrom) so Python's requests/urllib3 does not
  # route internal traffic through the proxy regardless of no_proxy matching quirks.
  - target:
      kind: Deployment
      name: .*federation-rest
    patch: |-
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: HTTP_PROXY
          value: ""
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: http_proxy
          value: ""
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: HTTPS_PROXY
          value: ""
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: https_proxy
          value: ""
  - target:
      kind: Deployment
      name: .*portal
    patch: |-
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: HTTP_PROXY
          value: ""
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: http_proxy
          value: ""
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: HTTPS_PROXY
          value: ""
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: https_proxy
          value: ""
