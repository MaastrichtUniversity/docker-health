apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

images:
- name: registry.prod.dh.unimaas.nl/docker-health/federation-rest
  newTag: '2026.1.3'
- name: registry.prod.dh.unimaas.nl/docker-health/federation-test
  newTag: '2026.1.3'
- name: registry.prod.dh.unimaas.nl/docker-health/etl-zib-rest
  newTag: '2026.1.3'
- name: registry.prod.dh.unimaas.nl/docker-health/etl-zib-test
  newTag: '2026.1.3'
- name: registry.prod.dh.unimaas.nl/docker-health/etl-zib-pipeline
  newTag: '2026.1.3'
- name: registry.prod.dh.unimaas.nl/docker-health/portal
  newTag: '2026.1.3'
- name: registry.prod.dh.unimaas.nl/docker-health/transform-rest
  newTag: '2026.1.3'
- name: registry.prod.dh.unimaas.nl/docker-health/jupyter-zib
  newTag: '2026.1.3'
- name: registry.prod.dh.unimaas.nl/docker-health/terminology-server-proxy
  newTag: '2026.1.3'
- name: registry.prod.dh.unimaas.nl/docker-health/init-container
  newTag: '2026.1.3'

resources:
# DHP resources
- jupyter
- node-envida
- node-mumc
- node-vitala
- node-zio

generatorOptions:
  disableNameSuffixHash: true

patches:
# 'Global' patches that apply to all of one sort
# Storage class patches
- target:
    kind: PersistentVolume
  patch: |-
    - op: replace
      path: /spec/storageClassName
      value: local-path
- target:
    kind: PersistentVolumeClaim
  patch: |-
    - op: replace
      path: /spec/storageClassName
      value: local-path
# Image pull secret patches
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
      - name: registry-credentials
- target:
    kind: Job
  patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
      - name: registry-credentials
# imagePullPolicy patches
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
      value: IfNotPresent
- target:
    kind: Job
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
      value: IfNotPresent
# Proxy patches
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: "/spec/template/spec/containers/0/envFrom/-"
      value:
        configMapRef:
          name: proxy-config

# federation-rest pods connect to the internal Kubernetes API (10.43.0.1) and
# other in-cluster services only. Explicitly unset the proxy env vars via `env`
# (which takes precedence over envFrom) so Python's requests/urllib3 does not
# route internal traffic through the proxy regardless of no_proxy matching quirks.
- target:
    kind: Deployment
    name: .*federation-rest
  patch: |-
    - op: add
      path: "/spec/template/spec/containers/0/env/-"
      value:
        name: HTTP_PROXY
        value: ""
    - op: add
      path: "/spec/template/spec/containers/0/env/-"
      value:
        name: http_proxy
        value: ""
    - op: add
      path: "/spec/template/spec/containers/0/env/-"
      value:
        name: HTTPS_PROXY
        value: ""
    - op: add
      path: "/spec/template/spec/containers/0/env/-"
      value:
        name: https_proxy
        value: ""
- target:
    kind: Deployment
    name: .*portal
  patch: |-
    - op: add
      path: "/spec/template/spec/containers/0/env/-"
      value:
        name: HTTP_PROXY
        value: ""
    - op: add
      path: "/spec/template/spec/containers/0/env/-"
      value:
        name: http_proxy
        value: ""
    - op: add
      path: "/spec/template/spec/containers/0/env/-"
      value:
        name: HTTPS_PROXY
        value: ""
    - op: add
      path: "/spec/template/spec/containers/0/env/-"
      value:
        name: https_proxy
        value: ""

configMapGenerator:
- name: proxy-config
  namespace: dh-health
  literals:
    - HTTP_PROXY=http://proxy.unimaas.nl:3128
    - http_proxy=http://proxy.unimaas.nl:3128
    - HTTPS_PROXY=http://proxy.unimaas.nl:3128
    - https_proxy=http://proxy.unimaas.nl:3128
    - NO_PROXY=localhost,.dh.local,.dh-health,.unimaas.nl,.datahubmaastricht.nl,137.120.31.0/24,.cluster.local,10.42.0.0/12,10.43.0.0/12,10.43.0.10,10.43.0.1
    - no_proxy=localhost,.dh.local,.dh-health,.unimaas.nl,.datahubmaastricht.nl,137.120.31.0/24,.cluster.local,10.42.0.0/12,10.43.0.0/12,10.43.0.10,10.43.0.1
    