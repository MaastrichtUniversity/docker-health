apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dh-health-mumc

resources:
  - vault-auth.yaml
  - ../../../base/openehr-nodes/mumc
  - config
  - service-discovery

components:
  - components
  - ../shared-components

patches:
  - target:
      group: ""
      version: v1
      kind: PersistentVolumeClaim
      name: git-repo-pvc
    path: patches/pvc.yaml
  - target:
      group: batch
      version: v1
      kind: Job
      name: etl-zib-pipeline
    path: patches/job/mumc-etl-zib-delete-demo-data.yaml
  - target:
      group: batch
      version: v1
      kind: Job
      name: etl-zib-pipeline
    path: patches/job/mumc-etl-zib-add-demo-data.yaml