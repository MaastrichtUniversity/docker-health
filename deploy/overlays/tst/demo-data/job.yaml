apiVersion: batch/v1
kind: Job
metadata:
  name: populate-pvc-with-git-repo
  namespace: dh-health
spec:
  template:
    spec:
      containers:
        - name: git-sync
          image: alpine/git:latest
          envFrom:
            - configMapRef:
                name: git-config
          env:
            - name: http_proxy
              value: "http://proxy.unimaas.nl:3128"
            - name: https_proxy
              value: "http://proxy.unimaas.nl:3128"
            - name: no_proxy
              value: "localhost,.dh.local,.dh-health,.unimaas.nl,.datahubmaastricht.nl,137.120.31.0/16,.cluster.local,10.42.0.0/16,10.43.0.10"        
          command:
            - sh
            - -c
            - |
              set -e
              if [ -d "/repo/.git" ]; then
                echo "Repository already exists, fetching updates..."
                cd /repo
                git fetch --all
                git reset --hard "origin/$GIT_BRANCH"
                git checkout "$GIT_BRANCH"
              else
                echo "Cloning fresh repository..."
                git clone https://github.com/MaastrichtUniversity/docker-health.git /repo
                cd /repo
                git checkout "$GIT_BRANCH"
              fi
          volumeMounts:
            - name: git-repo
              mountPath: /repo
      restartPolicy: Never
      volumes:
        - name: git-repo
          persistentVolumeClaim:
            claimName: git-repo-pvc