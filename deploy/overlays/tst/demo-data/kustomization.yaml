apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: git-demo-data

generatorOptions:
  disableNameSuffixHash: true

resources:
- namespace.yaml
- pv.yaml
- pvc.yaml
- job.yaml

configMapGenerator:
- name: git-config
  namespace: git-demo-data
  literals:
    - GIT_BRANCH=DHDO-2211