apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dh-health

resources:
- pvc.yaml
- job.yaml

patches:
- target:
    kind: Deployment
    name: jupyter-zib
  path: jupyter-delete-patch.yaml
- target:
    kind: Deployment
    name: jupyter-zib
  path: jupyter-add-patch.yaml

configMapGenerator:
- name: git-config
  namespace: dh-health
  literals:
    - GIT_BRANCH=PLACEHOLDER