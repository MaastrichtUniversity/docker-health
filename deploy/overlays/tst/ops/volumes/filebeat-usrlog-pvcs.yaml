apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-filebeat-usrlog
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-csi
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: nfs-filebeat-usrlog
    volumeAttributes:
      server: fhml-srv017.unimaas.nl
      share: /bkp/tst-k3s/logs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filebeat-usrlog-pvc
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-csi
  volumeName: pv-filebeat-usrlog