apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dh-health-ops

resources:
- namespace.yaml
- vault-auth.yaml
- secrets.yaml
- elk-gateway.yaml
- ../../../base-ops

images:
- name: registry.prod.dh.unimaas.nl/docker-health/elk
  newTag: '2026.1.1'

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
# Filebeat
  - name: filebeat-certificate-authorities
    files:
        -  certs/ca.crt
  - name: filebeat-certificate
    files:
        -  certs/filebeat.dh-health-ops.crt
  - name: filebeat-key
    files:
        -  certs/filebeat.dh-health-ops.key
# Logstash (ELK)
  - name: logstash-certificate-authorities
    files:
        -  certs/ca.crt
  - name: logstash-certificate
    files:
        -  certs/elk.dh-health-ops.crt
  - name: logstash-key
    files:
        -  certs/elk.dh-health-ops.key
  - name: kibana-password
    literals:
      - password=kibana
  - name: elastic-password
    literals:
      - password=elastic

patches:
  - path: filebeat-configmap-patch.yaml
    target:
      kind: ConfigMap
      name: filebeat-config
  # 'Global' patches that apply to all of one sort
  # Storage class patches
  - target:
      kind: PersistentVolume
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: local-path
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: local-path
  # Image pull secret patches
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/imagePullSecrets
        value:
        - name: registry-credentials
  # imagePullPolicy patches
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  # Proxy patches
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: "/spec/template/spec/containers/0/envFrom/-"
        value:
          configMapRef:
            name: proxy-config

configMapGenerator:
- name: proxy-config
  literals:
    - HTTP_PROXY=http://proxy.unimaas.nl:3128
    - http_proxy=http://proxy.unimaas.nl:3128
    - HTTPS_PROXY=http://proxy.unimaas.nl:3128
    - https_proxy=http://proxy.unimaas.nl:3128
    - NO_PROXY=localhost,127.0.0.1,.dh.local,.dh-health,.dh-health-envida,.dh-health-vitala,.dh-health-mumc,.dh-health-zio,.dh-health-test-federation,.dh-health-test-single-node,.unimaas.nl,.datahubmaastricht.nl,epic-pid.storage.surfsara.nl,edr-neu.eu.endpoint.security.microsoft.com,137.120.31.0/24,137.120.31.76,.cluster.local,10.42.0.0/12,10.43.0.0/12,10.43.0.10,10.43.0.1,10.96.0.0/12,192.168.59.0/24,192.168.49.0/24,192.168.39.0/24
    - no_proxy=localhost,127.0.0.1,.dh.local,.dh-health,.dh-health-envida,.dh-health-vitala,.dh-health-mumc,.dh-health-zio,.dh-health-test-federation,.dh-health-test-single-node,.unimaas.nl,.datahubmaastricht.nl,epic-pid.storage.surfsara.nl,edr-neu.eu.endpoint.security.microsoft.com,137.120.31.0/24,137.120.31.76,.cluster.local,10.42.0.0/12,10.43.0.0/12,10.43.0.10,10.43.0.1,10.96.0.0/12,192.168.59.0/24,192.168.49.0/24,192.168.39.0/24