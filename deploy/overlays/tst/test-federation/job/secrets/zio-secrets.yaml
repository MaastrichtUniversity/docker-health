apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zio-federation-key
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: prod-vault.tst
    kind: ClusterSecretStore
  target:
    name: zio-federation-key
    template:
      engineVersion: v2
      data:
        key: "{{ .zio_federation_key }}"
  dataFrom:
    - extract:
        key: hdp-env/zio
---
