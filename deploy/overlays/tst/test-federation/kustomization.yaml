apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dh-health

resources:
- ../vault-operator/secrets
- job.yaml
- role.yaml
- ../../../base/common
- ../../../base/terminology-server-proxy
# ENVIDA-node
- ../../../base/openehr-nodes/envida/ehrbase
- ../../../base/openehr-nodes/envida/ehrdb
- ../../../base/openehr-nodes/envida/etl-zib/etl-config
- ../../../base/openehr-nodes/envida/etl-zib/etl-zib-pipeline
- ../../../base/openehr-nodes/envida/federation-rest
- ../../../base/openehr-nodes/envida/transform-rest
# MUMC-node
- ../../../base/openehr-nodes/mumc/ehrbase
- ../../../base/openehr-nodes/mumc/ehrdb
- ../../../base/openehr-nodes/mumc/etl-zib/etl-config
- ../../../base/openehr-nodes/mumc/etl-zib/etl-zib-pipeline
- ../../../base/openehr-nodes/mumc/federation-rest
- ../../../base/openehr-nodes/mumc/transform-rest
# VITALA-node
- ../../../base/openehr-nodes/vitala/ehrbase
- ../../../base/openehr-nodes/vitala/ehrdb
- ../../../base/openehr-nodes/vitala/etl-zib/etl-config
- ../../../base/openehr-nodes/vitala/etl-zib/etl-zib-pipeline
- ../../../base/openehr-nodes/vitala/federation-rest
- ../../../base/openehr-nodes/vitala/transform-rest
# ZIO-node
- ../../../base/openehr-nodes/zio/ehrbase
- ../../../base/openehr-nodes/zio/ehrdb
- ../../../base/openehr-nodes/zio/etl-zib/etl-config
- ../../../base/openehr-nodes/zio/etl-zib/etl-zib-pipeline
- ../../../base/openehr-nodes/zio/federation-rest
- ../../../base/openehr-nodes/zio/transform-rest

components:
# Federation service role
- ../roles

images:
- name: registry.prod.dh.unimaas.nl/docker-health/federation-rest
  newTag: '2026.1.1'
- name: registry.prod.dh.unimaas.nl/docker-health/federation-test
  newTag: '2026.1.1'
- name: registry.prod.dh.unimaas.nl/docker-health/etl-zib-rest
  newTag: '2026.1.1'
- name: registry.prod.dh.unimaas.nl/docker-health/etl-zib-test
  newTag: '2026.1.1'
- name: registry.prod.dh.unimaas.nl/docker-health/etl-zib-pipeline
  newTag: '2026.1.1'
- name: registry.prod.dh.unimaas.nl/docker-health/transform-rest
  newTag: '2026.1.1'
- name: registry.prod.dh.unimaas.nl/docker-health/terminology-server-proxy
  newTag: '2026.1.1'

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: etl-data-encryption-passphrase
    namespace: dh-health
    literals:
      - passphrase=foobar

patches:
# imagePullPolicy patches
- target:
    kind: Deployment
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
- target:
    kind: Job
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent

# Image pull secret
- target:
    kind: Deployment
  patch: |-
    - op: replace
      path: /spec/template/spec/imagePullSecrets
      value:
      - name: registry-credentials
- target:
    kind: Job
  patch: |-
    - op: replace
      path: /spec/template/spec/imagePullSecrets
      value:
      - name: registry-credentials

# Storage class patches
- target:
    kind: PersistentVolume
  patch: |-
    - op: replace
      path: /spec/storageClassName
      value: local-path
- target:
    kind: PersistentVolumeClaim
  patch: |-
    - op: replace
      path: /spec/storageClassName
      value: local-path

# Proxy patches (non-federation-rest deployments)
- target:
    kind: Deployment
    name: ehrbase|ehrdb|transform-rest|etl-zib|terminology-server-proxy
  patch: |-
    - op: add
      path: "/spec/template/spec/containers/0/env/-"
      value:
        name: http_proxy
        value: "http://proxy.unimaas.nl:3128"
    - op: add
      path: "/spec/template/spec/containers/0/env/-"
      value:
        name: https_proxy
        value: "http://proxy.unimaas.nl:3128"
    - op: add
      path: "/spec/template/spec/containers/0/env/-"
      value:
        name: no_proxy
        value: "localhost,.dh.local,.dh-health,.unimaas.nl,.datahubmaastricht.nl,137.120.31.0/16,.cluster.local,10.42.0.0/12,10.43.0.1,10.43.0.10"
# Proxy patches (federation-rest deployments - proxy disabled)
- target:
    kind: Deployment
    name: .*-federation-rest
  patch: |-
    - op: add
      path: "/spec/template/spec/containers/0/env/-"
      value:
        name: http_proxy
        value: ""
    - op: add
      path: "/spec/template/spec/containers/0/env/-"
      value:
        name: https_proxy
        value: ""
    - op: add
      path: "/spec/template/spec/containers/0/env/-"
      value:
        name: no_proxy
        value: "localhost,.dh.local,.dh-health,.unimaas.nl,.datahubmaastricht.nl,137.120.31.0/16,.cluster.local,10.42.0.0/12,10.43.0.1,10.43.0.10"
    - op: add
      path: "/spec/template/spec/containers/0/env/-"
      value:
        name: HTTP_PROXY
        value: ""
    - op: add
      path: "/spec/template/spec/containers/0/env/-"
      value:
        name: HTTPS_PROXY
        value: ""

# Patch the data mounts to use the GIT PVC
- path: patches/job/envida-etl-zib-delete-demo-data.yaml
- path: patches/job/envida-etl-zib-add-demo-data.yaml
- path: patches/job/vitala-etl-zib-delete-demo-data.yaml
- path: patches/job/vitala-etl-zib-add-demo-data.yaml
- path: patches/job/mumc-etl-zib-delete-demo-data.yaml
- path: patches/job/mumc-etl-zib-add-demo-data.yaml
- path: patches/job/zio-etl-zib-delete-demo-data.yaml
- path: patches/job/zio-etl-zib-add-demo-data.yaml