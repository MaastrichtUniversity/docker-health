apiVersion: batch/v1
kind: Job
metadata:
  name: zio-etl-zib-pipeline
  namespace: dh-health
spec:
  template:
    spec:
      containers:
        - name: zio-etl-zib-pipeline
          volumeMounts:
            - name: demo-data
              mountPath: /code/data/zio-demo-data
              subPath: src/data/zio-demo-data
      volumes:
        - name: demo-data
          persistentVolumeClaim:
            claimName: git-repo-pvc
