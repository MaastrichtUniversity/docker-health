apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-ehrbase-ingress
  namespace: dh-health
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ehrbase.test.tst.dh.unimaas.nl
      secretName: ehrbase-tls-secret
  rules:
    - host: ehrbase.test.tst.dh.unimaas.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: test-ehrbase
                port:
                  number: 8080
