apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vitala-portal-creds
  namespace: dh-health
  labels:
    ehrnode: all
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: prod-vault.tst
    kind: SecretStore
  target:
    name: vitala-portal-creds
    template:
      engineVersion: v2
      data:
        username: "demo@vitala.nl"
        password: "{{ .password }}"
  data:
  - secretKey: password
    remoteRef:
      key: hdp-env/vitala
      property: demo@vitala.nl
---
apiVersion: external-secrets.io/v1
