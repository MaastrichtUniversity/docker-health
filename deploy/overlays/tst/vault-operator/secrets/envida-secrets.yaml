apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: envida-portal-creds
  namespace: dh-health
  labels:
    ehrnode: all
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: prod-vault.tst
    kind: SecretStore
  target:
    name: envida-portal-creds
    template:
      engineVersion: v2
      data:
        username: "demo@envida.nl"
        password: "{{ .password }}"
  data:
  - secretKey: password
    remoteRef:
      key: hdp-env/envida
      property: demo@envida.nl
---
