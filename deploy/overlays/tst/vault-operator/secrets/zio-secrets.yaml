apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zio-portal-creds
  namespace: dh-health
  labels:
    ehrnode: all
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: prod-vault.tst
    kind: SecretStore
  target:
    name: zio-portal-creds
    template:
      engineVersion: v2
      data:
        username: "demo@zio.nl"
        password: "{{ .password }}"
  data:
  - secretKey: password
    remoteRef:
      key: hdp-env/zio
      property: demo@zio.nl
---
