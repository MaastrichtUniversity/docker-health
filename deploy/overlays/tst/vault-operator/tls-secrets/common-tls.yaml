apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: federation-tls-secret
  namespace: dh-health
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: prod-vault.tst
    kind: SecretStore
  target:
    name: federation-tls-secret
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .federation_crt }}"
        tls.key: "{{ .federation_key }}"
  data:
  - secretKey: federation_crt
    remoteRef:
      key: fhml-srv018__tst-k3s-hdp
      property: federation.tst.dh.unimaas.nl.crt
  - secretKey: federation_key
    remoteRef:
      key: fhml-srv018__tst-k3s-hdp
      property: federation.tst.dh.unimaas.nl.key
---
apiVersion: external-secrets.io/v1
