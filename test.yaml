apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jupyter-zib
  name: jupyter-zib
  namespace: dh-health-jupyter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter-zib
  template:
    metadata:
      labels:
        app: jupyter-zib
    spec:
      containers:
      - command:
        - start-notebook.sh
        - --ServerApp.token=$(APP_TOKEN)
        env:
        - name: CHOWN_HOME
          value: "yes"
        - name: CHOWN_HOME_OPTS
          value: -R
        - name: APP_TOKEN
          valueFrom:
            secretKeyRef:
              key: SERVER_APP_TOKEN
              name: jupyter-zib-creds
        - name: DATA_ENCRYPTION_PASSPHRASE
