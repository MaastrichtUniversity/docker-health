apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: etl-zib-pipeline
  name: etl-zib-pipeline
  namespace: dh-health-envida
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: etl-zib-pipeline
    spec:
      containers:
      - env:
        - name: DATA_ENCRYPTION_PASSPHRASE
          valueFrom:
            secretKeyRef:
              key: passphrase
              name: etl-data-encryption-passphrase
        - name: EHRBASE_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: ehrbase-creds
        - name: EHRBASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: ehrbase-creds
        - name: TRANSFORM_SPRING_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: transform-creds
        - name: TRANSFORM_SPRING_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: transform-creds
        envFrom:
        - configMapRef:
            name: dry-run-config
        - configMapRef:
            name: timezone-config
        - configMapRef:
            name: zib-templates-config
        - configMapRef:
            name: etl-config-base
        - configMapRef:
            name: etl-config-node
        image: registry.prod.dh.unimaas.nl/docker-health/etl-zib-pipeline:2026.1.3
        imagePullPolicy: IfNotPresent
        name: etl-zib-pipeline
        volumeMounts:
        - mountPath: /code/outputs
          name: outputs
          subPath: envida/pipeline
        - mountPath: /code/data/envida-demo-data
          name: data
        - mountPath: /code/logs/envida
          name: etl-logs
          subPath: envida/pipeline
      imagePullSecrets:
      - name: registry-credentials
      initContainers:
      - command:
        - /wait-for-service.sh
        - http://terminology-server-proxy:8080/management/health
        - Terminology server proxy
        image: registry.prod.dh.unimaas.nl/docker-health/init-container:2026.1.3
        imagePullPolicy: IfNotPresent
        name: wait-terminology-proxy
      - command:
        - /wait-for-service.sh
        - http://ehrbase:8080/ehrbase/management/health
        - EHRbase
        image: registry.prod.dh.unimaas.nl/docker-health/init-container:2026.1.3
        imagePullPolicy: IfNotPresent
        name: wait-ehrbase
      - command:
        - /wait-for-service.sh
        - http://transform-rest:8080/management/health
        - Transform REST
        image: registry.prod.dh.unimaas.nl/docker-health/init-container:2026.1.3
        imagePullPolicy: IfNotPresent
        name: wait-transform-rest
      restartPolicy: Never
      volumes:
      - name: outputs
        persistentVolumeClaim:
          claimName: output-pvc-envida
      - hostPath:
          path: /mnt/demo-data/data/envida-demo-data
          type: Directory
        name: data
      - name: etl-logs
        persistentVolumeClaim:
          claimName: log-pvc-envida
