        - name: MUMC__EHRBASE_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: mumc-ehrbase-creds
        - name: MUMC__EHRBASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: mumc-ehrbase-creds
        - name: MUMC__EHRBASE_BASE_URL
          value: http://ehrbase.dh-health-mumc:8080/ehrbase/rest/openehr/v1
        - name: MUMC__DATASET_FOLDER_NAME
          valueFrom:
            configMapKeyRef:
              key: DATASET_FOLDER_NAME
              name: mumc-etl-config-node
        - name: MUMC__SOURCE_SYSTEM_ID
          valueFrom:
            configMapKeyRef:
              key: SOURCE_SYSTEM_ID
              name: mumc-etl-config-node
        - name: MUMC__LOGGER_FILENAME
          valueFrom:
            configMapKeyRef:
              key: LOGGER_FILENAME
              name: mumc-etl-config-node
        - name: MUMC__TRANSFORM_SPRING_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: mumc-transform-creds
        - name: MUMC__TRANSFORM_SPRING_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: mumc-transform-creds
        - name: MUMC__TRANSFORM_SPRING_BASE_URL
          value: http://transform-rest.dh-health-mumc:8080
        - name: VITALA__EHRBASE_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: vitala-ehrbase-creds
        - name: VITALA__EHRBASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: vitala-ehrbase-creds
        - name: VITALA__EHRBASE_BASE_URL
          value: http://ehrbase.dh-health-vitala:8080/ehrbase/rest/openehr/v1
        - name: VITALA__DATASET_FOLDER_NAME
          valueFrom:
            configMapKeyRef:
              key: DATASET_FOLDER_NAME
              name: vitala-etl-config-node
        - name: VITALA__SOURCE_SYSTEM_ID
          valueFrom:
            configMapKeyRef:
              key: SOURCE_SYSTEM_ID
              name: vitala-etl-config-node
        - name: VITALA__LOGGER_FILENAME
          valueFrom:
            configMapKeyRef:
              key: LOGGER_FILENAME
              name: vitala-etl-config-node
        - name: VITALA__TRANSFORM_SPRING_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: vitala-transform-creds
        - name: VITALA__TRANSFORM_SPRING_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: vitala-transform-creds
        - name: VITALA__TRANSFORM_SPRING_BASE_URL
          value: http://transform-rest.dh-health-vitala:8080
        - name: ZIO__EHRBASE_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: zio-ehrbase-creds
        - name: ZIO__EHRBASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: zio-ehrbase-creds
        - name: ZIO__EHRBASE_BASE_URL
          value: http://ehrbase.dh-health-zio:8080/ehrbase/rest/openehr/v1
        - name: ZIO__DATASET_FOLDER_NAME
          valueFrom:
            configMapKeyRef:
              key: DATASET_FOLDER_NAME
              name: zio-etl-config-node
        - name: ZIO__SOURCE_SYSTEM_ID
          valueFrom:
            configMapKeyRef:
              key: SOURCE_SYSTEM_ID
              name: zio-etl-config-node
        - name: ZIO__LOGGER_FILENAME
          valueFrom:
            configMapKeyRef:
              key: LOGGER_FILENAME
              name: zio-etl-config-node
        - name: ZIO__TRANSFORM_SPRING_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: zio-transform-creds
        - name: ZIO__TRANSFORM_SPRING_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: zio-transform-creds
        - name: ZIO__TRANSFORM_SPRING_BASE_URL
          value: http://transform-rest.dh-health-zio:8080
        envFrom:
        - configMapRef:
            name: dry-run-config
        - configMapRef:
            name: timezone-config
        - configMapRef:
            name: zib-templates-config
        - configMapRef:
            name: etl-config-base
        - configMapRef:
            name: proxy-config-5k9587b6b4
        image: registry.prod.dh.unimaas.nl/docker-health/jupyter-zib:2026.1.3
        imagePullPolicy: IfNotPresent
        name: jupyter-zib
        ports:
        - containerPort: 8888
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - mountPath: /home/jovyan/data
          name: demo-data
        - mountPath: /home/jovyan/work
          name: notebooks
        - mountPath: /var/log/jupyter
          name: jupyter-logs
      imagePullSecrets:
      - name: registry-credentials
      initContainers:
      - args:
        - mkdir -p /var/log/jupyter && chown 1000:100 /var/log/jupyter
        command:
        - /bin/sh
        - -c
        image: busybox:1.28
        name: init-log-dir
        volumeMounts:
        - mountPath: /var/log/jupyter
          name: jupyter-logs
      securityContext:
        runAsUser: 0
      volumes:
      - hostPath:
          path: /mnt/demo-data
          type: Directory
        name: demo-data
      - name: notebooks
        persistentVolumeClaim:
          claimName: notebooks-pvc
      - name: jupyter-logs
        persistentVolumeClaim:
          claimName: log-pvc-jupyter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ehrbase
  name: ehrbase
  namespace: dh-health-mumc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ehrbase
  template:
    metadata:
      labels:
        app: ehrbase
    spec:
      containers:
      - args:
        - -Dspring.http.codec.max-in-memory-size=10MB
        - -jar
        - -Dspring.profiles.active=docker
        - -Dlogging.file.name=/var/log/ehrbase/ehrbase.log
        - ehrbase.jar
        command:
        - java
        env:
        - name: SECURITY_AUTHUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: ehrbase-creds
        - name: SECURITY_AUTHPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: ehrbase-creds
        - name: SECURITY_AUTHADMINUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: ehrbase-admin-creds
        - name: SECURITY_AUTHADMINPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: ehrbase-admin-creds
        - name: DB_USER_ADMIN
          valueFrom:
            secretKeyRef:
              key: username
              name: ehrbase-db-admin-creds
        - name: DB_PASS_ADMIN
          valueFrom:
            secretKeyRef:
              key: password
              name: ehrbase-db-admin-creds
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: ehrbase-db-creds
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              key: password
              name: ehrbase-db-creds
        envFrom:
        - configMapRef:
            name: timezone-config
        - configMapRef:
            name: ehrbase-config-base
        - configMapRef:
            name: ehrbase-config-node
        - configMapRef:
            name: proxy-config-5k9587b6b4
        image: ehrbase/ehrbase:2.33.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /ehrbase/management/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
        name: ehrbase
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ehrbase/management/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - mountPath: /var/log/ehrbase
          name: ehrbase-logs
          subPath: ehrbase
      imagePullSecrets:
      - name: registry-credentials
      initContainers:
      - args:
        - mkdir -p /var/log/ehrbase && chown 100:101 /var/log/ehrbase
        command:
        - /bin/sh
        - -c
        image: busybox:1.28
        name: init-log-dir
        volumeMounts:
        - mountPath: /var/log/ehrbase
          name: ehrbase-logs
          subPath: ehrbase
      volumes:
      - name: ehrbase-logs
        persistentVolumeClaim:
          claimName: log-pvc-mumc
