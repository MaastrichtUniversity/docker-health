    spec:
      containers:
      - args:
        - -Dspring.http.codec.max-in-memory-size=10MB
        - -jar
        - -Dspring.profiles.active=docker
        - -Dlogging.file.name=/var/log/ehrbase/ehrbase.log
        - ehrbase.jar
        command:
        - java
        env:
        - name: SECURITY_AUTHUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: ehrbase-creds
        - name: SECURITY_AUTHPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: ehrbase-creds
        - name: SECURITY_AUTHADMINUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: ehrbase-admin-creds
        - name: SECURITY_AUTHADMINPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: ehrbase-admin-creds
        - name: DB_USER_ADMIN
          valueFrom:
            secretKeyRef:
              key: username
              name: ehrbase-db-admin-creds
        - name: DB_PASS_ADMIN
          valueFrom:
            secretKeyRef:
              key: password
              name: ehrbase-db-admin-creds
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: ehrbase-db-creds
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              key: password
              name: ehrbase-db-creds
        envFrom:
        - configMapRef:
            name: timezone-config
        - configMapRef:
            name: ehrbase-config-base
        - configMapRef:
            name: ehrbase-config-node
        - configMapRef:
            name: proxy-config-5k9587b6b4
        image: ehrbase/ehrbase:2.33.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /ehrbase/management/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
        name: ehrbase
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ehrbase/management/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - mountPath: /var/log/ehrbase
