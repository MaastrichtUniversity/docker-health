apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: ehrdb
  name: ehrdb
  namespace: dh-health-envida
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ehrdb
  serviceName: ehrdb
  template:
    metadata:
      labels:
        app: ehrdb
    spec:
      containers:
      - args:
        - postgres
        - -c
        - logging_collector=on
        - -c
        - log_directory=/var/log/postgresql
        - -c
        - log_filename=postgresql.log
        - -c
        - log_statement=none
        - -c
        - log_file_mode=0644
        - -c
        - log_rotation_age=0
        - -c
        - log_rotation_size=0
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: ehrbase-db-postgres-creds
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: ehrbase-db-postgres-creds
        - name: EHRBASE_USER_ADMIN
          valueFrom:
            secretKeyRef:
              key: username
              name: ehrbase-db-admin-creds
        - name: EHRBASE_PASSWORD_ADMIN
          valueFrom:
            secretKeyRef:
              key: password
              name: ehrbase-db-admin-creds
        - name: EHRBASE_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: ehrbase-db-creds
        - name: EHRBASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: ehrbase-db-creds
        envFrom:
        - configMapRef:
            name: timezone-config
        image: ehrbase/ehrbase-v2-postgres:16.2
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - pg_isready -U $$POSTGRES_USER
          initialDelaySeconds: 30
          periodSeconds: 10
        name: ehrdb
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /var/log/postgresql
          name: postgres-logs
          subPath: ehrdb
      initContainers:
      - args:
        - mkdir -p /var/log/postgresql && chown 70:70 /var/log/postgresql
        command:
        - /bin/sh
        - -c
        image: busybox:1.28
        name: init-log-dir
        volumeMounts:
        - mountPath: /var/log/postgresql
          name: postgres-logs
          subPath: ehrdb
      volumes:
      - name: postgres-logs
        persistentVolumeClaim:
          claimName: log-pvc-envida
---
