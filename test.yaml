          valueFrom:
            secretKeyRef:
              key: username
              name: envida-ehrbase-creds
        - name: ENVIDA__EHRBASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: envida-ehrbase-creds
        - name: ENVIDA__EHRBASE_BASE_URL
          value: http://ehrbase.dh-health-envida:8080/ehrbase/rest/openehr/v1
        - name: ENVIDA__DATASET_FOLDER_NAME
          valueFrom:
            configMapKeyRef:
              key: DATASET_FOLDER_NAME
